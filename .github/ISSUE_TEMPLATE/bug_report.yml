name: Bug Report
description: Create a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please do **not** paste sensitive credentials, API keys, private paths, or confidential host tokens in this issue.

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running? (e.g. Ubuntu 24.04, Windows 11, macOS Sequoia)
      placeholder: "e.g. Windows 11 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What Node.js version are you using? (Must be >= 22.0.0)
      placeholder: "e.g. v22.13.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server / Package Version
      description: Run `high-performance-mcp-server --version` or check package.json
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which transport protocol were you using?
      options:
        - stdio
        - Streamable HTTP
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Active Security Profile
      description: Which tool profile was active?
      options:
        - safe (default)
        - diagnostics
        - benchmark
        - admin
        - all
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce the behavior?
      placeholder: |
        1. Run `high-performance-mcp-server --transport=...`
        2. Execute tool `...` with args `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Stderr Logs
      description: What actually happened? (Paste redacted stderr logs if available)
    validations:
      required: true
